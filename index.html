<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#061417">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- SEO & Social OpenGraph -->
  <title>Tileworks Studio — Games & Experiences</title>
  <meta name="description" content="Discover premium indie games, experimental prototypes, and interactive experiences crafted by Tileworks Studio.">
  <meta property="og:title" content="Tileworks Studio — Games & Experiences">
  <meta property="og:description" content="Enter the realm of Tileworks. Explore our latest games and interactive experiences.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Interactive Background Canvas & Ambient Lighting -->
  <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>
  <div class="ambient-glow" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Top Floating HUD -->
  <div class="hud-top-bar">
    <!-- Studio Status Chip -->
    <div class="status-badge" title="Tileworks Studio Status">
      <span class="status-pulse"></span>
      <span class="status-text">LIVE STUDIO</span>
    </div>

    <!-- HUD Controls -->
    <div class="hud-actions">
      <!-- Share Trigger -->
      <button class="hud-btn" id="share-btn" aria-label="Share Studio Hub" title="Share Hub">
        <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <!-- Audio Controller -->
      <button class="hud-btn audio-btn" id="audio-toggle-btn" aria-label="Toggle Sound Experience" title="Toggle Sound">
        <div class="equalizer-bars" id="equalizer">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <span class="audio-label" id="audio-status">Sound</span>
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <main class="menu-wrapper">
    
    <!-- Hero / Header Section -->
    <header class="header-section">
      <div class="logo-wrapper">
        <a href="https://tileworksgamesstudio.github.io/" class="logo-link" id="main-logo" aria-label="Tileworks Studio Home">
          <div class="logo-backdrop-glow"></div>
          <div class="logo-ring-pulse"></div>
          <div class="logo-frame">
            <img src="logo.png" alt="Tileworks Studio Logo" class="logo-img" id="logo-img" onerror="this.src='background.svg'">
            <div class="logo-shine-layer"></div>
          </div>
        </a>
      </div>

      <h1 class="studio-title">TILEWORKS STUDIO</h1>
      <p class="studio-subtitle">Games & Interactive Worlds</p>

      <!-- Category Filter Pills -->
      <nav class="category-nav" aria-label="Link categories" id="category-nav">
        <button class="cat-pill active" data-category="all">All</button>
        <button class="cat-pill" data-category="games">Games</button>
        <button class="cat-pill" data-category="featured">Featured</button>
        <button class="cat-pill" data-category="community">Community</button>
      </nav>
    </header>

    <!-- 2-Column Responsive Dynamic Grid -->
    <section class="links-section" aria-label="Games and Links">
      <div id="links-grid" class="links-grid" role="list">
        <!-- Skeleton Loaders -->
        <div class="tile-skeleton"></div>
        <div class="tile-skeleton"></div>
        <div class="tile-skeleton"></div>
        <div class="tile-skeleton"></div>
      </div>
    </section>

    <!-- Footer Space -->
    <footer class="footer-space">
      <div class="footer-divider"></div>
      <p class="copyright">© <span id="current-year"></span> Tileworks Studio. All rights reserved.</p>
      <p class="footer-tagline">Crafted for curious minds & bold players.</p>
    </footer>
  </main>

  <!-- Share Modal Modal / Sheet -->
  <div class="modal-overlay" id="share-modal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" id="modal-close-btn" aria-label="Close Share Modal">✕</button>
      <h3 class="modal-title">Share Tileworks Studio</h3>
      <p class="modal-subtitle">Scan QR code or copy the link below</p>
      
      <div class="qr-box" id="qr-box">
        <!-- Dynamic Generated SVG QR Code -->
      </div>

      <div class="share-copy-box">
        <input type="text" readonly id="share-url-input" class="share-input">
        <button class="share-copy-btn" id="copy-link-btn">
          <span>Copy</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Bar -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Confetti Canvas for Easter Eggs -->
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <!-- Audio Element Fallback (Looks for audio.mp3, bgm.mp3, etc.) -->
  <audio id="bg-audio" preload="auto" loop>
    <source src="audio.mp3" type="audio/mpeg">
    <source src="bgm.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
    <source src="audio.ogg" type="audio/ogg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
